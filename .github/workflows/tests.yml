name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        include:
          - laravel: '^11.0'
            testbench: '^9.0'
          - laravel: '^12.0'
            testbench: '^10.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@1e29d2af9f90f64e9286d069754fe7ffa0dfd992
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, xdebug
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update laravel/framework:${{ matrix.laravel }} orchestra/testbench:${{ matrix.testbench }}
          composer update --no-interaction --prefer-dist --with-all-dependencies --ignore-platform-req=ext-zip

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Run Pest tests
        run: composer test

      - name: Run Pint
        run: composer format -- --test

      - name: Run PHPStan
        run: composer analyse
